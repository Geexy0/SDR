[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-dashboard"
version = "0.8.0"
description = "PortaPack H4M Pro + HackRF Pro Command & Control dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pyserial>=3.5",
  "pydantic>=2.9.0",
  "websockets>=13.0",
  "numpy>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0",
  "httpx>=0.27.0",
]

[project.scripts]
pp-dashboard = "pp_dashboard.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "hil: hardware-in-the-loop RX smoke (requires --run-hil + USB HackRF)",
]

[tool.coverage.run]
source = ["pp_dashboard"]
branch = false
# Full-package gate — only legacy HTML console / CLI-style entry surfaces omitted.
omit = [
  "*/web/home.py",
  "*/__main__.py",
]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
