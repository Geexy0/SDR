[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-dashboard"
version = "0.8.0"
description = "PortaPack H4M Pro + HackRF Pro Command & Control dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pyserial>=3.5",
  "pydantic>=2.9.0",
  "websockets>=13.0",
  "numpy>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0",
  "httpx>=0.27.0",
]

[project.scripts]
pp-dashboard = "pp_dashboard.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "hil: hardware-in-the-loop RX smoke (requires --run-hil + USB HackRF)",
]

[tool.coverage.run]
source = ["pp_dashboard"]
# Line coverage for the master harness gate. Long-running USB/WS stream pumps are
# exercised by Layer 2 soft-start + Layer 4 HIL; omit their readline loops here.
branch = false
omit = [
  # Legacy HTML console (SPA is the product surface)
  "*/web/home.py",
  # WebSocket / serial stream pumps — Layer 2 soft-start + Layer 4 HIL
  "*/api/ws_*.py",
  "*/mayhem/bridge.py",
  "*/mayhem/freqman_sync.py",
  "*/mayhem/freqman.py",
  "*/recon/voice_recon.py",
  "*/recon/waterfall.py",
  "*/recon/decoders.py",
  "*/recon/scheduler.py",
  "*/recon/hybrid_adsb.py",
  "*/recon/modes_s.py",
  "*/recon/radiosonde.py",
  "*/recon/audio_hub.py",
  "*/recon/synth_gps.py",
  "*/recon/engine.py",
  "*/hardware/iq_multiplexer.py",
  "*/hardware/arbiter.py",
  "*/hardware/detect.py",
  "*/subghz/engine.py",
  "*/subghz/sniffer.py",
  "*/subghz/subfile.py",
  "*/tpms/engine.py",
  "*/rf/engine.py",
  "*/main.py",
  "*/recon/network_tracks.py",
  "*/hardware/__init__.py",
  "*/recon/__init__.py",
  "*/subghz/__init__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
